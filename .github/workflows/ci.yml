name: Data Registry CI
on:
  - push
  - pull_request
  - workflow_dispatch

jobs:

  unit-tests:
    runs-on: ubuntu-latest

    # Service containers to run with `runner-job`
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: desc_data_registry
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Our strategy lists the OS and Python versions we want to test on.
    strategy:

      # Don't quit all jobs if only one job fails.
      fail-fast: false

      matrix:
        python-version: ["3.12"]
        include:
          - python-version: "3.10"
            if: github.event_name == 'pull_request'
          - python-version: "3.11"
            if: github.event_name == 'pull_request'
          - python-version: "3.13"
            if: github.event_name == 'pull_request'

    # Our CI steps for this job.
    steps:
      # Check out this repository code.
      - name: Check out repository code
        uses: actions/checkout@v4

      # Install Python.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install our package.
      - name: Install dataregistry
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pytest

      # GitPython is needed when creating a new database
      - name: Install GitPython
        run: |
          python -m pip install GitPython

      # Make a dummy config file.
      - name: Create dummy config file
        run: |
          echo "sqlalchemy.url : postgresql://postgres:postgres@localhost:5432/desc_data_registry" > $HOME/.config_reg_access
          chmod og-rw $HOME/.config_reg_access

      # Create schemas
      - name: Create data registry schemas
        run: |
          python scripts/create_registry_schema.py --config $HOME/.config_reg_access --create-both

      # Run CI tests
      - name: Run CI tests
        run: |
          pytest -v -s tests/unit_tests

  end-to-end-tests:
    runs-on: ubuntu-latest

    env:
      DATAREG_CONFIG: "${{ github.workspace }}/config.txt"
      DATAREG_BACKEND: "postgres"

    # Service containers to run with `runner-job`
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: desc_data_registry
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Our strategy lists the OS and Python versions we want to test on.
    strategy:

      # Don't quit all jobs if only one job fails.
      fail-fast: false

      matrix:
        python-version: ["3.12"]
        include:
          - python-version: "3.10"
            if: github.event_name == 'pull_request'
          - python-version: "3.11"
            if: github.event_name == 'pull_request'
          - python-version: "3.13"
            if: github.event_name == 'pull_request'


    # Our CI steps for this job.
    steps:
      # Check out this repository code.
      - name: Check out repository code
        uses: actions/checkout@v4

      # Install Python.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install our package.
      - name: Install dataregistry
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pytest

      # GitPython is needed when creating a new database
      - name: Install GitPython
        run: |
          python -m pip install GitPython

      # Make a dummy config file.
      - name: Create dummy config file
        run: |
          echo "sqlalchemy.url : postgresql://postgres:postgres@localhost:5432/desc_data_registry" > $DATAREG_CONFIG
          chmod og-rw $DATAREG_CONFIG

      # Create schemas
      - name: Create data registry schemas
        run: |
          python scripts/create_registry_schema.py --config $DATAREG_CONFIG --create-both

      # Run CI tests
      - name: Run CI tests
        run: |
          cd tests/end_to_end_tests

          # Run some test queries
          pytest -v test_*.py

  sqlite-end-to-end-tests:
    runs-on: ubuntu-latest

    env:
      DATAREG_CONFIG: "${{ github.workspace }}/config.txt"
      DATAREG_BACKEND: "sqlite"

    # Our strategy lists the OS and Python versions we want to test on.
    strategy:

      # Don't quit all jobs if only one job fails.
      fail-fast: false

      matrix:
        python-version: ["3.12"]
        include:
          - python-version: "3.10"
            if: github.event_name == 'pull_request'
          - python-version: "3.11"
            if: github.event_name == 'pull_request'
          - python-version: "3.13"
            if: github.event_name == 'pull_request'

    # Our CI steps for this job.
    steps:
      # Check out this repository code.
      - name: Check out repository code
        uses: actions/checkout@v3

      # Install Python.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      # Install our package.
      - name: Install dataregistry
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pytest

      # GitPython is needed when creating a new database
      - name: Install GitPython
        run: |
          python -m pip install GitPython

      # Make a dummy config file.
      - name: Create dummy config file
        run: |
          echo "sqlalchemy.url : sqlite:///${HOME}/registry.db" > $DATAREG_CONFIG

      # Create schema
      - name: Create data registry default schema
        run: |
          python scripts/create_registry_schema.py --config $DATAREG_CONFIG

      # Run CI tests
      - name: Run CI tests
        run: |
          cd tests/end_to_end_tests

          # Run some test queries
          pytest -v -m "not skip" test_*.py

  api-tests:
    runs-on: ubuntu-latest

    env:
      # The API server reads its connection details from these.
      DATAREGISTRY_API_DATABASE_HOST: "localhost"
      DATAREGISTRY_API_DATABASE_PORT: "5432"
      DATAREGISTRY_API_DATABASE_NAME: "desc_data_registry"
      DATAREGISTRY_API_DATABASE_USERNAME: "postgres"
      DATAREGISTRY_API_DATABASE_PASSWORD: "postgres"
      # Never silently skip: a database must be reachable in CI.
      DATAREGISTRY_API_TEST_REQUIRE_DB: "1"

    # Service containers to run with `runner-job`
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: desc_data_registry
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Our strategy lists the OS and Python versions we want to test on.
    strategy:

      # Don't quit all jobs if only one job fails.
      fail-fast: false

      matrix:
        python-version: ["3.12"]
        include:
          - python-version: "3.10"
            if: github.event_name == 'pull_request'
          - python-version: "3.11"
            if: github.event_name == 'pull_request'
          - python-version: "3.13"
            if: github.event_name == 'pull_request'

    # Our CI steps for this job.
    steps:
      # Check out this repository code.
      - name: Check out repository code
        uses: actions/checkout@v4

      # Install Python.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install the package plus the API and API-test dependency groups.
      # The `api-test` group pulls in fastapi, pytest, httpx and GitPython
      # (the last is needed by scripts/create_registry_schema.py).
      - name: Install dataregistry and API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install --group api-test

      # The API test fixtures create their own schemas, so unlike the other
      # jobs there is no schema-creation step here.
      - name: Run API tests
        run: |
          pytest -v tests/api_tests
